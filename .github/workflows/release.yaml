on:
  push:
    branches: ["master"]

name: Release

jobs:
  prepare:
    name: Generate Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Generate tag
        id: tag
        run: echo "::set-output name=value::$(date '+%Y%m%d-%H%M')"

  build:
    name: Docker Build and Push (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64/v8
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/f2:${{ needs.prepare.outputs.tag }}-${{ matrix.slug }}

  manifest:
    name: Create Multi-Arch Manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/f2:${{ needs.prepare.outputs.tag }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/f2:${{ needs.prepare.outputs.tag }}-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/f2:${{ needs.prepare.outputs.tag }}-arm64
